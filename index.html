<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doon — Something Grand Is Coming</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #304433;
      color: #CF8D46;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, "Times New Roman", serif;
    }

    .landing {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }

    .content {
      max-width: 1000px;
    }

    h1 {
      font-size: clamp(5rem, 14vw, 11rem);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: -0.06em;
      margin-bottom: 30px;
    }

    p {
      font-size: clamp(1.5rem, 3vw, 2.75rem);
      line-height: 1.15;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    @media (max-width: 600px) {
      .landing {
        padding: 30px 20px;
      }

      h1 {
        margin-bottom: 20px;
      }

      p {
        max-width: 320px;
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>
  <main class="landing">
    <div class="content">
      <h1>Doon,</h1>
      <p>A friendly neighbourhood spot<br />is on its way!</p>
    </div>
  </main>
</body>
</html>
